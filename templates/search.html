{% extends 'base.html' %}
{% block title %}Search | Coffee Social Hub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/week3.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/week6.css') }}">
{% endblock %}

{% block content %}

<div class="leaderboard-hero">
    <h1><i class="bi bi-search" style="color:var(--caramel)"></i> Search</h1>
    <div style="margin-top:1rem;max-width:480px;margin-left:auto;margin-right:auto;">
        <div class="search-page-bar">
            <i class="bi bi-search"></i>
            <input
                type="text"
                id="search-page-input"
                placeholder="Search users or cafes..."
                value="{{ query }}"
                autofocus>
        </div>
    </div>
</div>

<div class="container" style="max-width:720px;margin-top:2rem;">

    <!-- Users results -->
    <div id="search-users-section" style="display:none;">
        <h5 style="font-weight:700;margin-bottom:1rem;">
            <i class="bi bi-people" style="color:var(--caramel)"></i> People
        </h5>
        <div id="search-users-list"></div>
    </div>

    <!-- Cafes results -->
    <div id="search-cafes-section" style="display:none;margin-top:1.5rem;">
        <h5 style="font-weight:700;margin-bottom:1rem;">
            <i class="bi bi-cup-hot" style="color:var(--caramel)"></i> Cafes
        </h5>
        <div id="search-cafes-list"></div>
    </div>

    <!-- Empty state -->
    <div id="search-empty" style="text-align:center;padding:3rem;color:var(--muted);">
        <i class="bi bi-search" style="font-size:2.5rem;display:block;margin-bottom:1rem;"></i>
        <h5>Search for users or cafes</h5>
        <p>Type something above to get started</p>
    </div>

</div>

{% endblock %}

{% block extra_js %}
<script>
const searchInput = document.getElementById('search-page-input');
let searchTimer;

// Track follow state per username
const followState = {};

searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(searchInput.value.trim()), 300);
});

// Run immediately if query in URL
if ("{{ query }}") {
    runSearch("{{ query }}");
}

function runSearch(query) {
    if (!query) {
        document.getElementById('search-empty').style.display = 'block';
        document.getElementById('search-empty').innerHTML = `
            <i class="bi bi-search" style="font-size:2.5rem;display:block;margin-bottom:1rem;"></i>
            <h5>Search for users or cafes</h5>
            <p>Type something above to get started</p>
        `;
        document.getElementById('search-users-section').style.display = 'none';
        document.getElementById('search-cafes-section').style.display = 'none';
        return;
    }

    fetch(`/api/search?q=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById('search-empty').style.display = 'none';

            // ── Users ─────────────────────────────────────────────────────
            const usersSection = document.getElementById('search-users-section');
            const usersList    = document.getElementById('search-users-list');

            if (data.users.length > 0) {
                usersSection.style.display = 'block';
                usersList.innerHTML = data.users.map(u => `
                    <div class="search-result-row">

                        <!-- Avatar links to profile -->
                        <a href="/user/${u.username}" class="search-result-av"
                           style="text-decoration:none;flex-shrink:0;">
                            ${u.avatar
                                ? `<img src="${u.avatar}" alt="${u.username}">`
                                : `<div class="sr-fallback">${u.username.charAt(0).toUpperCase()}</div>`
                            }
                        </a>

                        <!-- Info -->
                        <div style="flex:1;min-width:0;">
                            <a href="/user/${u.username}" style="
                                font-weight:700;
                                font-size:0.95rem;
                                color:var(--text,#1a0e00);
                                text-decoration:none;
                                display:block;
                            ">
                                ${u.username}
                            </a>
                            <div style="font-size:0.78rem;color:var(--muted);
                                white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                                ${u.bio ? u.bio.substring(0, 50) : 'No bio yet'}
                                ${u.followers > 0
                                    ? `&nbsp;•&nbsp;<i class="bi bi-people"></i> ${u.followers}`
                                    : ''}
                            </div>
                        </div>

                        <!-- Follow button -->
                        <button
                            id="follow-btn-${u.username}"
                            onclick="followFromSearch('${u.username}', this)"
                            style="
                                background: var(--caramel);
                                color: white;
                                border: none;
                                border-radius: 20px;
                                padding: 6px 18px;
                                font-size: 0.78rem;
                                font-weight: 700;
                                cursor: pointer;
                                flex-shrink: 0;
                                transition: all 0.2s;
                                white-space: nowrap;
                            ">
                            Follow
                        </button>

                    </div>
                `).join('');

                // Check follow status for each user
                data.users.forEach(u => checkFollowStatus(u.username));

            } else {
                usersSection.style.display = 'none';
            }

            // ── Cafes ─────────────────────────────────────────────────────
            const cafesSection = document.getElementById('search-cafes-section');
            const cafesList    = document.getElementById('search-cafes-list');

            if (data.cafes.length > 0) {
                cafesSection.style.display = 'block';
                cafesList.innerHTML = data.cafes.map(c => `
                    <a href="/shop/${c.route.replace('shop_','')}"
                       class="search-result-row"
                       style="text-decoration:none;">
                        <div class="search-result-av" style="
                            background:linear-gradient(135deg,#1a0e00,var(--caramel));
                            flex-shrink:0;">
                            <i class="bi bi-cup-hot-fill"
                               style="color:white;font-size:1.1rem;"></i>
                        </div>
                        <div style="flex:1;min-width:0;">
                            <div style="
                                font-weight:700;
                                font-size:0.95rem;
                                color:var(--text,#1a0e00);">
                                ${c.name}
                            </div>
                            <div style="font-size:0.78rem;color:var(--muted);">
                                <i class="bi bi-geo-alt"></i> ${c.location}
                                &nbsp;•&nbsp;
                                <i class="bi bi-star-fill"
                                   style="color:var(--caramel);"></i>
                                ${c.rating}
                                &nbsp;•&nbsp;
                                ${c.tags.join(', ')}
                            </div>
                        </div>
                        <i class="bi bi-chevron-right"
                           style="color:var(--muted);flex-shrink:0;"></i>
                    </a>
                `).join('');
            } else {
                cafesSection.style.display = 'none';
            }

            // Show empty if truly nothing found
            if (data.users.length === 0 && data.cafes.length === 0) {
                document.getElementById('search-empty').style.display = 'block';
                document.getElementById('search-empty').innerHTML = `
                    <i class="bi bi-search"
                       style="font-size:2.5rem;display:block;margin-bottom:1rem;"></i>
                    <h5>No results for "${query}"</h5>
                    <p>Try a different search term</p>
                `;
            }
        })
        .catch(err => console.error('Search error:', err));
}

// ── Check if already following ────────────────────────────────
function checkFollowStatus(username) {
    fetch(`/api/followers/${username}`)
        .then(r => r.json())
        .then(followers => {
            const isFollowing = followers.some(
                f => f.username === window.currentUser
            );
            const btn = document.getElementById(`follow-btn-${username}`);
            if (!btn) return;
            if (isFollowing) {
                setFollowingState(btn);
            }
        })
        .catch(() => {});
}

// ── Toggle follow from search ─────────────────────────────────
function followFromSearch(username, btn) {
    fetch(`/api/follow/${username}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if (data.following) {
                setFollowingState(btn);
                if (typeof showToast === 'function') {
                    showToast(`Following ${username} ✓`, 'success');
                }
            } else {
                setFollowState(btn);
                if (typeof showToast === 'function') {
                    showToast(`Unfollowed ${username}`, 'info');
                }
            }
        })
        .catch(err => console.error('Follow error:', err));
}

function setFollowingState(btn) {
    btn.textContent              = 'Following';
    btn.style.background         = 'rgba(196,122,43,0.1)';
    btn.style.color              = 'var(--caramel)';
    btn.style.border             = '1.5px solid var(--caramel)';
}

function setFollowState(btn) {
    btn.textContent      = 'Follow';
    btn.style.background = 'var(--caramel)';
    btn.style.color      = 'white';
    btn.style.border     = 'none';
}
</script>
{% endblock %}
