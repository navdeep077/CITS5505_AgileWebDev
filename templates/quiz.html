{% extends 'base.html' %}
{% block title %}Coffee Personality Quiz | Coffee Social Hub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/week6.css') }}">
{% endblock %}

{% block content %}

<div class="leaderboard-hero">
    <h1>☕ Coffee Personality Quiz</h1>
    <p>Find out what kind of coffee person you are</p>
</div>

<div class="container" style="max-width:580px;margin-top:2rem;">
    <div id="quiz-container">

        <!-- Progress bar -->
        <div class="quiz-progress-wrap">
            <div class="quiz-progress-bar" id="quiz-progress" style="width:0%"></div>
        </div>
        <div style="text-align:right;font-size:0.78rem;color:var(--muted);margin-bottom:1rem;">
            Question <span id="q-current">1</span> of <span id="q-total">6</span>
        </div>

        <!-- Question -->
        <div class="quiz-card" id="quiz-card">
            <h4 id="quiz-question" style="font-weight:700;margin-bottom:1.5rem;"></h4>
            <div id="quiz-options"></div>
        </div>

        <!-- Result -->
        <div id="quiz-result" style="display:none;" class="quiz-result-card">
            <div id="result-emoji" style="font-size:3rem;margin-bottom:0.5rem;"></div>
            <h3 id="result-title" style="font-weight:700;color:var(--caramel);"></h3>
            <p id="result-desc" style="color:var(--muted);margin:0.5rem 0 1.5rem;"></p>
            <button onclick="restartQuiz()" style="
                background:var(--caramel);color:white;border:none;
                border-radius:10px;padding:10px 24px;
                font-size:0.9rem;font-weight:600;cursor:pointer;">
                Retake Quiz
            </button>
        </div>

    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
