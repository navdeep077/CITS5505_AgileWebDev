{% extends 'base.html' %}
{% block title %}Offline | Coffee Social Hub{% endblock %}

{% block content %}
<div style="
    text-align:center;
    padding:5rem 2rem;
    max-width:480px;
    margin:0 auto;
">
    <div style="font-size:4rem;margin-bottom:1rem;">☕</div>
    <h2 style="font-weight:700;margin-bottom:0.5rem;">
        You are offline
    </h2>
    <p style="color:var(--muted);margin-bottom:2rem;">
        Looks like your connection dropped. Grab a coffee
        while we wait for it to come back.
    </p>
    <button onclick="window.location.reload()"
        style="
            background:var(--caramel);color:white;border:none;
            border-radius:10px;padding:12px 28px;font-size:0.95rem;
            font-weight:700;cursor:pointer;font-family:inherit;">
        Try Again
    </button>
</div>
{% endblock %}
