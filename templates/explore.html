{% extends 'base.html' %}
{% block title %}Explore | Coffee Social Hub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/social.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/week3.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/week5.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/week6.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/week7.css') }}">
{% endblock %}

{% block content %}

<div class="leaderboard-hero">
    <i class="bi bi-compass-fill" style="font-size:2rem;color:var(--caramel);"></i>
    <h1 style="margin-top:0.5rem;">Explore</h1>
    <p>Discover posts and people</p>
</div>

<div class="container" style="max-width:900px;">

    <!-- Tabs -->
    <div class="explore-tabs">
        <button class="explore-tab active" data-tab="posts"
            onclick="showTab('posts')">
            <i class="bi bi-grid-3x3"></i> Posts
        </button>
        <button class="explore-tab" data-tab="people"
            onclick="showTab('people')">
            <i class="bi bi-people"></i> People
        </button>
        <button class="explore-tab" data-tab="trending"
            onclick="showTab('trending')">
            <i class="bi bi-fire"></i> Trending
        </button>
    </div>

    <!-- Posts Tab -->
    <div id="tab-posts">
        <div id="explore-grid" class="explore-grid"></div>
    </div>

    <!-- People Tab -->
    <div id="tab-people" style="display:none;">
        <div id="people-list" style="margin-top:1.5rem;"></div>
    </div>

    <!-- Trending Tab -->
    <div id="tab-trending" style="display:none;">
        <div id="trending-list"
             style="max-width:680px;margin:1.5rem auto 0;"></div>
    </div>

</div>

<!-- Post detail modal — centered popup -->
<div id="post-modal" class="post-modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <button id="close-modal" class="close-modal">×</button>
        <div id="modal-post-container"></div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    window.trendingCafes = {{ trending_cafes | tojson }};
</script>
<script src="{{ url_for('static', filename='js/social.js') }}"></script>
<script src="{{ url_for('static', filename='js/explore.js') }}"></script>
{% endblock %}
