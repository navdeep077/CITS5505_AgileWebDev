{% extends 'base.html' %}
{% block title %}Saved Posts | Coffee Social Hub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/social.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/week3.css') }}">
{% endblock %}

{% block content %}
<div style="max-width:640px;margin:0 auto;padding:1.5rem 1rem;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;">
        <i class="bi bi-bookmark-fill" style="font-size:1.8rem;color:var(--caramel);"></i>
        <div>
            <h4 style="margin:0;font-weight:700;">Saved Posts</h4>
            <p style="margin:0;font-size:0.82rem;color:var(--muted);">Posts you have bookmarked</p>
        </div>
    </div>
    <div id="bookmarks-feed"></div>
</div>

<div id="post-modal" class="post-modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <button id="close-modal" class="close-modal">×</button>
        <div id="modal-post-container"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/social.js') }}"></script>
<script>
window.currentUser = "{{ session.get('user', '') }}";

document.addEventListener('DOMContentLoaded', () => {
    const feed = document.getElementById('bookmarks-feed');

    feed.innerHTML = `
        <div class="skeleton-post">
            <div style="display:flex;gap:12px;margin-bottom:12px;">
                <div class="skeleton skeleton-avatar"></div>
                <div style="flex:1;">
                    <div class="skeleton skeleton-line" style="width:40%;"></div>
                </div>
            </div>
            <div class="skeleton skeleton-image"></div>
        </div>`;

    fetch('/api/bookmarks')
        .then(r => r.json())
        .then(posts => {
            feed.innerHTML = '';
            if (posts.length === 0) {
                feed.innerHTML = `
                    <div style="text-align:center;padding:3rem;color:var(--muted);">
                        <i class="bi bi-bookmark" style="font-size:2.5rem;display:block;margin-bottom:1rem;"></i>
                        <h5>No saved posts yet</h5>
                        <p>Tap the bookmark icon on any post to save it here</p>
                    </div>`;
                return;
            }
            posts.forEach(post => renderPost(post, 'bookmarks-feed'));
        })
        .catch(() => {
            feed.innerHTML = `<p style="color:var(--muted);text-align:center;padding:2rem;">Could not load bookmarks</p>`;
        });

    document.getElementById('close-modal')?.addEventListener('click', () => {
        document.getElementById('post-modal').classList.add('hidden');
    });
    document.querySelector('#post-modal .modal-overlay')?.addEventListener('click', () => {
        document.getElementById('post-modal').classList.add('hidden');
    });
});
</script>
{% endblock %}
